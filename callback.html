<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Auth Callback</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:48px auto;padding:0 18px;line-height:1.6;color:#222}
  h1{font-size:24px}
  .code{font-size:18px;word-break:break-all;background:#f5f7ff;border:1px solid #cdd8ff;border-radius:10px;padding:16px;margin:18px 0}
  button{font-size:16px;padding:10px 18px;border:0;border-radius:8px;background:#1565c0;color:#fff;cursor:pointer}
  .ok{color:#0a7d2c;font-weight:bold}
  small{color:#666}
</style>
</head>
<body>
<h1>Đã cấp quyền TikTok ✔</h1>
<p>Copy đoạn mã <strong>code</strong> bên dưới, rồi quay lại nói với Claude <em>"code là ..."</em> hoặc chạy:
<br><code>python tiktok_lay_token.py code &lt;dán_vào_đây&gt;</code></p>

<div class="code" id="code">(đang đọc mã...)</div>
<button onclick="cp()">Copy mã</button> <span id="msg"></span>

<p style="margin-top:26px"><small>Trang này chỉ hiển thị mã trên trình duyệt của bạn, không gửi đi đâu.</small></p>

<script>
  var p = new URLSearchParams(window.location.search);
  var code = p.get("code");
  var el = document.getElementById("code");
  if (code) { el.textContent = code; }
  else { el.textContent = "Không thấy tham số ?code — hãy chắc bạn tới đây từ nút Authorize của TikTok."; }
  function cp(){
    if(!code) return;
    navigator.clipboard.writeText(code).then(function(){
      document.getElementById("msg").innerHTML = '<span class="ok">Đã copy!</span>';
    });
  }
</script>
</body>
</html>
